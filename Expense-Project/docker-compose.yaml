name: expense
networks:
  default: 
   name: sudha
   external: true

services:

  mysql:
    image: mysql:0.0
    container_name: mysql
  
  backend:
    image: backend:0.0
    container_name: backend
    command: sh -c "sleep 20 && /opt/server/index.js"
    depends_on:
      - mysql
    ports:
      - 8080:8080
  
  frontend:
    image: frontend:0.0
    container_name: frontend
    depends_on:
      - backend
    ports:
      - 80:80