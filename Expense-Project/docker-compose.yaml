name: expense
networks:
  default: 
   name: sudha
   external: true
volumes:
  sudha:
    external: true

services:

  mysql:
    image: mysql:0.0
    container_name: mysql
    volumes:
      - source: sudha
        target: /var/lib/mysql
        type: volume
  
  backend:
    image: backend:0.0
    container_name: backend
    command: sh -c "sleep 20 && node /opt/server/index.js"
    depends_on:
      - mysql
    ports:
      - 8080:8080
  
  frontend:
    image: frontend:0.0
    container_name: frontend
    depends_on:
      - backend
    ports:
      - 80:80